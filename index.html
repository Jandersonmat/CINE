<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recomendador de películas</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
  </head>
<body>
    <main>
      <section id="inicio">
        <h1>Recomendador de películas</h1>
        <p class="eslogan">Soy tu asesor de cine</p>
        <p>Ingresa tu edad y te recomendamos una película.</p>
        <form>
          <label for="edad-usuario">Tu edad</label>
          <input
            type="number"
            id="edad-usuario"
            min="1"
            max="120"
            required
            placeholder="Ej: 25"
          />
          <button type="submit">Recomiéndame</button>
          <p id="mensaje-error"></p>
        </form>
      </section>

      <section id="resultado">
        <h2 id="titulo-pelicula">titulo de prueba</h2>
        <p id="descripcion-pelicula">descripcion prueba</p>
        <p class="valoracion">
          <span id="estrellas"></span>
          <span id="puntaje"></span>
        </p>
        <button type="button" id="btn-volver">Probar con otra edad</button>
      </section>
    </main>

</body>
</html>
